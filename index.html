<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Leingbox Finance</title>
  <style>
*{box-sizing:border-box}
:root{
  --bg:#f4f5f7;
  --card:#fff;
  --text:#111;
  --muted:#777;
  --line:#e7e7e7;
  --dark:#111;
}
body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  background:var(--bg);
  color:var(--text);
}
.hidden{display:none!important}
.login-page{
  min-height:100vh;
  display:grid;
  place-items:center;
  padding:24px;
  background:linear-gradient(180deg,#fafafa,#f1f2f4);
}
.login-card{
  width:min(410px,100%);
  background:#fff;
  border:1px solid var(--line);
  border-radius:24px;
  padding:32px;
  box-shadow:0 18px 50px rgba(0,0,0,.08);
}
.logo{
  font-size:13px;
  font-weight:900;
  letter-spacing:.22em;
}
.logo.small{font-size:11px;margin-bottom:4px}
h1{margin:12px 0 5px;font-size:30px}
h2,h3{margin:0}
.sub{margin:0 0 24px;color:var(--muted)}
label{
  display:block;
  font-size:13px;
  font-weight:750;
  margin:16px 0 8px;
}
input{
  width:100%;
  border:1px solid var(--line);
  border-radius:14px;
  padding:13px 14px;
  font-size:16px;
  outline:none;
  background:#fff;
}
input:focus{border-color:#aaa}
.btn{
  border:0;
  border-radius:14px;
  padding:12px 16px;
  font-weight:800;
  cursor:pointer;
}
.primary{background:var(--dark);color:#fff}
.secondary{background:#efefef;color:#222}
.login-card .primary{width:100%;margin-top:22px}
.error{
  min-height:18px;
  margin-top:10px;
  font-size:13px;
  color:#b42318;
}
.topbar{
  height:78px;
  padding:0 max(18px,calc((100vw - 1000px)/2));
  background:#fff;
  border-bottom:1px solid var(--line);
  display:flex;
  justify-content:space-between;
  align-items:center;
  position:sticky;
  top:0;
  z-index:10;
}
.user-area{display:flex;align-items:center;gap:10px}
.pill{
  padding:8px 11px;
  border-radius:999px;
  background:#f0f0f0;
  font-size:12px;
  font-weight:800;
}
.small-btn{padding:9px 12px}
.container{
  width:min(1000px,calc(100% - 28px));
  margin:24px auto 48px;
  display:grid;
  gap:18px;
}
.panel{
  background:#fff;
  border:1px solid var(--line);
  border-radius:20px;
  padding:22px;
}
.top-fields{
  display:grid;
  grid-template-columns:1.5fr 1fr;
  gap:14px;
}
.summary{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:12px;
  margin-top:20px;
}
.summary-item{
  padding:18px;
  border-radius:16px;
  background:#f7f7f7;
}
.summary-item span{
  display:block;
  color:var(--muted);
  font-size:12px;
  margin-bottom:8px;
}
.summary-item strong{font-size:22px}
.summary-item.balance{
  background:#111;
  color:#fff;
}
.summary-item.balance span{color:#ccc}
.money-box{position:relative}
.money-box span{
  position:absolute;
  left:13px;
  top:50%;
  transform:translateY(-50%);
  font-size:13px;
  color:#777;
  z-index:1;
}
.money-box input{padding-left:42px}
.panel-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:16px;
  margin-bottom:16px;
}
.panel-head p{
  margin:5px 0 0;
  color:var(--muted);
  font-size:13px;
}
.add-btn{white-space:nowrap}
.project-list{display:grid;gap:10px}
.project-row{
  display:grid;
  grid-template-columns:1fr 220px auto;
  gap:10px;
  padding:10px;
  border:1px solid var(--line);
  border-radius:16px;
  background:#fafafa;
}
.delete-btn{background:#eee;color:#555}
.empty{
  padding:28px 10px;
  text-align:center;
  border:1px dashed #d7d7d7;
  border-radius:16px;
  color:#888;
}
@media(max-width:700px){
  .top-fields,.summary,.project-row{grid-template-columns:1fr}
  .panel-head{align-items:stretch;flex-direction:column}
  .add-btn{width:100%}
  .topbar{padding:0 14px}
}

</style>
</head>
<body>
  <section id="loginPage" class="login-page">
    <div class="login-card">
      <div class="logo">LEINGBOX</div>
      <h1>Login</h1>
      <p class="sub"></p>

      <label for="username">Username</label>
      <input id="username" autocomplete="username" placeholder="Username">

      <label for="password">Password</label>
      <input id="password" type="password" autocomplete="current-password" placeholder="请输入密码">

      <button id="loginBtn" class="btn primary">LOGIN</button>
      <button id="forgotPasswordBtn" type="button" style="display:block;width:100%;margin-top:10px;background:none;border:0;color:#666;text-decoration:underline;cursor:pointer;">忘记密码？</button>
      <div id="loginError" class="error"></div>
    </div>
  </section>

  <section id="financePage" class="app hidden">
    <header class="topbar">
      <div>
        <div class="logo small">LEINGBOX</div>
        
      </div>
      <div class="user-area">
        <span id="signedUser" class="pill" style="display:none"></span>
        <button id="logoutBtn" class="btn secondary small-btn">Logout</button>
      </div>
    </header>

    <main class="container">
      <section class="panel">
        <div class="top-fields">
          <div class="field wide">
            <label>名字</label>
            <input id="personName" placeholder="输入名字">
          </div>

          <div class="field">
            <label>总数</label>
            <div class="money-box">
              <span>RM</span>
              <input id="totalAmount" type="number" min="0" step="0.01" placeholder="0.00">
            </div>
          </div>
        </div>

        <div class="summary">
          <div class="summary-item">
            <span>总数</span>
            <strong id="totalText">RM 0.00</strong>
          </div>
          <div class="summary-item">
            <span>- 价钱</span>
            <strong id="deductText">RM 0.00</strong>
          </div>
          <div class="summary-item balance">
            <span>剩多少</span>
            <strong id="balanceText">RM 0.00</strong>
          </div>
        </div>
      </section>

      <section class="panel">
        <div class="panel-head">
          <div>
            <h3>项目</h3>
            <p>每次新增、修改或删除后都会自动重新计算。</p>
          </div>
          <button id="addProjectBtn" class="btn primary add-btn">＋ 添加项目</button>
        </div>

        <div id="projectList" class="project-list"></div>
        <div id="emptyText" class="empty">还没有项目</div>
      </section>
    </main>
  </section>

  <template id="projectTemplate">
    <div class="project-row">
      <input class="project-name" placeholder="项目名字">
      <div class="money-box">
        <span>RM</span>
        <input class="project-price" type="number" min="0" step="0.01" placeholder="0.00">
      </div>
      <button class="btn delete-btn">删除</button>
    </div>
  </template>

  <script>

const SUPABASE_URL = "https://plusrybqlfwgmguqhsnx.supabase.co";
const SUPABASE_KEY = "sb_publishable_nvgOM36tptPGepF-_MouHQ_jeg55fec";

const $ = id => document.getElementById(id);

const state = {
  user: null,
  data: {
    name: "",
    total: 0,
    projects: []
  }
};

let saveTimer = null;

function formatRM(value){
  const n = Number(value || 0);
  return `RM ${n.toLocaleString("en-MY", {
    minimumFractionDigits: 2,
    maximumFractionDigits: 2
  })}`;
}

async function api(path, options = {}){
  const headers = {
    apikey: SUPABASE_KEY,
    Authorization: `Bearer ${SUPABASE_KEY}`,
    "Content-Type": "application/json",
    ...(options.headers || {})
  };

  const response = await fetch(`${SUPABASE_URL}/rest/v1/${path}`, {
    ...options,
    headers
  });

  if(!response.ok){
    throw new Error(await response.text());
  }

  const text = await response.text();
  return text ? JSON.parse(text) : null;
}

async function load(){
  const rows = await api(
    `leingbox_finance?username=eq.${encodeURIComponent(state.user)}&select=person_name,total_amount,projects`
  );

  const row = rows?.[0];

  state.data = row ? {
    name: row.person_name || "",
    total: Number(row.total_amount || 0),
    projects: Array.isArray(row.projects) ? row.projects : []
  } : {
    name: "",
    total: 0,
    projects: []
  };
}

async function saveNow(){
  await api(
    `leingbox_finance?username=eq.${encodeURIComponent(state.user)}`,
    {
      method: "PATCH",
      headers: { Prefer: "return=minimal" },
      body: JSON.stringify({
        person_name: state.data.name || "",
        total_amount: Number(state.data.total || 0),
        projects: state.data.projects,
        updated_at: new Date().toISOString()
      })
    }
  );
}

function save(){
  render();
  clearTimeout(saveTimer);
  saveTimer = setTimeout(async ()=>{
    try{
      await saveNow();
    }catch(err){
      console.error(err);
      alert("云端保存失败，请检查网络后再试。");
    }
  }, 350);
}

function totals(){
  const deduct = state.data.projects.reduce(
    (sum, p)=> sum + Number(p.price || 0),
    0
  );

  return {
    deduct,
    balance: Number(state.data.total || 0) - deduct
  };
}

function render(){
  $("personName").value = state.data.name || "";
  $("totalAmount").value = state.data.total || "";
  $("signedUser").textContent = "";

  const t = totals();
  $("totalText").textContent = formatRM(state.data.total);
  $("deductText").textContent = formatRM(t.deduct);
  $("balanceText").textContent = formatRM(t.balance);

  const list = $("projectList");
  list.innerHTML = "";
  $("emptyText").style.display = state.data.projects.length ? "none" : "block";

  state.data.projects.forEach((project, index)=>{
    const row = $("projectTemplate").content.firstElementChild.cloneNode(true);
    const name = row.querySelector(".project-name");
    const price = row.querySelector(".project-price");
    const del = row.querySelector(".delete-btn");

    name.value = project.name || "";
    price.value = project.price || "";

    name.addEventListener("input", ()=>{
      state.data.projects[index].name = name.value;
      save();
    });

    price.addEventListener("input", ()=>{
      state.data.projects[index].price = Number(price.value || 0);
      save();
    });

    del.addEventListener("click", ()=>{
      if(confirm("确定删除这个项目吗？")){
        state.data.projects.splice(index, 1);
        save();
      }
    });

    list.appendChild(row);
  });
}

async function doLogin(){
  const username = $("username").value.trim().toUpperCase();
  const password = $("password").value;
  const error = $("loginError");
  error.textContent = "正在登录...";

  try{
    const rows = await api(
      `leingbox_accounts?username=eq.${encodeURIComponent(username)}&password=eq.${encodeURIComponent(password)}&select=username`
    );

    if(!rows?.length){
      error.textContent = "Username 或 Password 不正确。";
      return;
    }

    state.user = username;
    sessionStorage.setItem("leingbox_login_user", username);

    await load();

    $("loginPage").classList.add("hidden");
    $("financePage").classList.remove("hidden");
    $("password").value = "";
    error.textContent = "";
    render();
  }catch(err){
    console.error(err);
    error.textContent = "连接数据库失败，请检查网络或 Supabase 设置。";
  }
}

$("loginBtn").addEventListener("click", doLogin);

$("forgotPasswordBtn").addEventListener("click", async ()=>{
  const username = $("username").value.trim().toUpperCase();
  const error = $("loginError");

  if(!username){
    error.textContent = "请先输入 Username。";
    return;
  }

  try{
    const rows = await api(
      `leingbox_accounts?username=eq.${encodeURIComponent(username)}&select=username`
    );

    if(!rows?.length){
      error.textContent = "找不到这个 Username。";
      return;
    }

    const newPassword = prompt("请输入新密码（至少 6 个字符）：");
    if(newPassword === null) return;

    if(newPassword.length < 6){
      error.textContent = "新密码至少需要 6 个字符。";
      return;
    }

    const confirmPassword = prompt("请再次输入新密码：");
    if(confirmPassword === null) return;

    if(newPassword !== confirmPassword){
      error.textContent = "两次输入的密码不一致。";
      return;
    }

    await api(
      `leingbox_accounts?username=eq.${encodeURIComponent(username)}`,
      {
        method: "PATCH",
        headers: { Prefer: "return=minimal" },
        body: JSON.stringify({ password: newPassword })
      }
    );

    error.textContent = "密码已更新，请使用新密码登录。";
    $("password").value = "";
  }catch(err){
    console.error(err);
    error.textContent = "暂时无法重设密码，请稍后再试。";
  }
});

$("password").addEventListener("keydown", e=>{
  if(e.key === "Enter") doLogin();
});

$("logoutBtn").addEventListener("click", ()=>{
  sessionStorage.removeItem("leingbox_login_user");
  state.user = null;
  $("financePage").classList.add("hidden");
  $("loginPage").classList.remove("hidden");
  $("username").value = "";
  $("password").value = "";
});

$("personName").addEventListener("input", e=>{
  state.data.name = e.target.value;
  save();
});

$("totalAmount").addEventListener("input", e=>{
  state.data.total = Number(e.target.value || 0);
  save();
});

$("addProjectBtn").addEventListener("click", ()=>{
  state.data.projects.push({name:"", price:0});
  save();
  setTimeout(()=>{
    const inputs = document.querySelectorAll(".project-name");
    inputs[inputs.length - 1]?.focus();
  }, 0);
});

(async function init(){
  const user = sessionStorage.getItem("leingbox_login_user");
  if(!user) return;

  state.user = user;

  try{
    await load();
    $("loginPage").classList.add("hidden");
    $("financePage").classList.remove("hidden");
    render();
  }catch(err){
    console.error(err);
    sessionStorage.removeItem("leingbox_login_user");
    state.user = null;
  }
})();

</script>
</body>
</html>
